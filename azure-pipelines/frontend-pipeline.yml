# Frontend CI/CD Pipeline
trigger:
  branches:
    include:
      - master
      - develop
      - feature/dockerize-app
  paths:
    include:
      - client/**

variables:
  - group: jiracicd-variables
  - name: imageTag
    value: $(Build.BuildId)

stages:
# Stage 1: Build & Push Docker Image
- stage: Build
  displayName: 'Build and Push Frontend Image'
  jobs:
  - job: BuildJob
    pool:
      vmImage: 'ubuntu-latest'
    steps:
    - checkout: self
    
    - task: Docker@2
      displayName: 'Login to ACR'
      inputs:
        command: login
        containerRegistry: acr-service-connection
        
    - task: Docker@2
      displayName: 'Build Frontend Image'
      inputs:
        command: build
        repository: $(DOCKER_REGISTRY)/$(FRONTEND_IMAGE_NAME)
        dockerfile: client/Dockerfile
        buildContext: client/
        tags: |
          $(imageTag)
          latest
          
    - task: Docker@2
      displayName: 'Push Frontend Image to ACR'
      inputs:
        command: push
        repository: $(DOCKER_REGISTRY)/$(FRONTEND_IMAGE_NAME)
        tags: |
          $(imageTag)
          latest

# Stage 2: Deploy to Static Web App
- stage: Deploy
  displayName: 'Deploy to Static Web App'
  dependsOn: Build
  condition: succeeded()
  jobs:
  - deployment: DeployFrontendJob
    environment: 'production'
    pool:
      vmImage: 'ubuntu-latest'
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self  # Added to ensure the agent downloads the code
          
          - task: AzureStaticWebApp@0
            displayName: 'Deploy Frontend to Azure Static Web App'
            inputs:
              app_location: 'client'  # Removed the leading slash to fix the path
              output_location: 'build'
              skip_api_build: true
            env:
              azure_static_web_apps_api_token: $(SWA_DEPLOYMENT_TOKEN)